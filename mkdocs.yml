site_name: Tryx
site_description: Rust-powered Python SDK for event-driven WhatsApp automation
site_author: krypton-byte
site_url: https://krypton-byte.github.io/tryx/
repo_url: https://github.com/krypton-byte/tryx
repo_name: krypton-byte/tryx
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - getting-started/installation.md
      - getting-started/quickstart.md
      - getting-started/authentication.md
      - getting-started/contributing.md
  - Core Concepts:
      - core-concepts/index.md
      - core-concepts/architecture.md
      - core-concepts/event-model.md
      - core-concepts/storage-backends.md
      - core-concepts/type-system.md
  - API Reference:
      - api/index.md
      - api/client.md
      - api/backend.md
      - api/contact.md
      - api/chat-actions.md
      - api/community.md
      - api/newsletter.md
      - api/groups.md
      - api/status.md
      - api/chatstate.md
      - api/blocking.md
      - api/polls.md
      - api/presence.md
      - api/privacy.md
      - api/profile.md
      - api/events.md
      - api/types.md
      - api/exceptions.md
      - api/helpers.md
      - api/wacore.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/command-bot.md
      - tutorials/profile-privacy.md
      - tutorials/poll-survey.md
      - tutorials/media-workflows.md
      - tutorials/group-automation.md
  - Operations:
      - operations/index.md
      - operations/deployment.md
      - operations/reliability.md
      - operations/troubleshooting.md
      - operations/performance.md
      - operations/security.md
  - Reference:
      - reference/index.md
      - faq/qna.md
      - reference/glossary.md
      - reference/error-handling.md
      - reference/roadmap.md
      - reference/changelog.md

theme:
  name: material
  variant: modern
  language: en
  custom_dir: docs/overrides
  logo: assets/mascot.png
  favicon: assets/mascot.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.code.line_highlight
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    # - toc.integrate  # not compatible with navigation.indexes
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ""
      canonical_version: null
      version_selector: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            allow_inspection: false
            find_stubs_package: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3
            members_order: source
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
      enable_inventory: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - toc:
      permalink: true
      toc_depth: 2-4

extra_css:
  - assets/stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krypton-byte/tryx
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tryx/
  generator: false
