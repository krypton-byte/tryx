[package]
name = "tryx"
version = "1.0.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tryx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.0", features = ["extension-module", "abi3-py38"] }
# NOTE: intentionally no `simd` feature — it turns on `#![feature(portable_simd)]`
# in wacore-binary, which is nightly-only and breaks stable builds (CI + sdist).
# NOTE: `voip` is excluded from the hardcoded feature set; it is controlled by
# crate-level features below so CI can toggle voip-libopus per target.
whatsapp-rust = { path = "libs/whatsapp-rust", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
whatsapp-rust-sqlite-storage = {path = "libs/whatsapp-rust/storages/sqlite-storage"}
whatsapp-rust-tokio-transport = {path = "libs/whatsapp-rust/transports/tokio-transport"}
whatsapp-rust-ureq-http-client = {path = "libs/whatsapp-rust/http_clients/ureq-client"}
wacore = { path = "libs/whatsapp-rust/wacore", default-features = false }
waproto = {path = "libs/whatsapp-rust/waproto"}
wacore-binary = { path = "libs/whatsapp-rust/wacore/binary", default-features = false }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "process"] }
async-trait = "0.1.89"
pyo3-async-runtimes = { version = "0.28.0", features = ["attributes", "tokio-runtime"] }
buffa = { version = "0.9.1", default-features = false, features = ["json"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
chrono = "0.4.44"
infer = { git = "https://github.com/bojand/infer", branch = "master" }
libloading = "0.8"
serde_json = "1"
bincode = "1"
bytes = "1"
async-channel = "2.5"

# Native streaming media decoding. The decoder runs in Rust; Python only controls
# the PyO3 player and receives lifecycle results.
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "pcm"] }
serde = { version = "1", features = ["derive"] }
# default-features = false disables wacore-appstate's default `simd` feature,
# which would otherwise pull in nightly-only portable_simd via wacore-binary.
wacore-appstate = { path = "libs/whatsapp-rust/wacore/appstate", default-features = false }

# ── Feature flags ──────────────────────────────────────────────────────
# `voip-mlow` is the default: pure-Rust MLOW codec adapter — no C opus
# dependency needed. This is the primary codec used by WhatsApp.
# `voip` enables full VoIP support (MLOW + libopus C binding). Only use
# this on platforms where the opus C library is readily available.
[features]
default = ["voip-mlow"]
voip = ["whatsapp-rust/voip"]
voip-mlow = ["whatsapp-rust/voip-mlow"]

# ── Release profile ────────────────────────────────────────────────────
# Aggressively optimize for binary size. Without this, debug symbols
# alone can bloat the .so to ~1 GB.
[profile.release]
strip = true          # strip debug symbols (~900 MB saved)
lto = true            # link-time optimization (20-30% smaller code)
opt-level = "z"       # optimize for size over speed
codegen-units = 1     # single codegen unit for better optimization
panic = "abort"       # skip unwind tables (~5% smaller)

[profile.dev]
# Keep dev builds fast.
opt-level = 0
