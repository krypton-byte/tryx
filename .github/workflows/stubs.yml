name: Validate Type Stubs

on:
  push:
    branches: [dev, master]
    paths:
      - "python/tryx/**/*.pyi"
      - "src/**/*.rs"
  pull_request:
    paths:
      - "python/tryx/**/*.pyi"
      - "src/**/*.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate .pyi stubs
    runs-on: ubuntu-latest
    concurrency:
      group: stubs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install type checkers
        run: uv pip install pyright mypy --system

      - name: Validate with pyright
        run: |
          pyright python/tryx/client.pyi \
                 python/tryx/events.pyi \
                 python/tryx/types.pyi \
                 python/tryx/wacore.pyi \
                 python/tryx/helpers.pyi \
                 python/tryx/backend.pyi \
                 python/tryx/exceptions.pyi \
                 python/tryx/__init__.pyi \
                 python/tryx/tryx.pyi \
                 python/tryx/media.pyi

      - name: Validate with mypy
        run: |
          mypy python/tryx/client.pyi \
               python/tryx/events.pyi \
               python/tryx/types.pyi \
               python/tryx/wacore.pyi \
               python/tryx/helpers.pyi \
               python/tryx/backend.pyi \
               python/tryx/exceptions.pyi \
               python/tryx/__init__.pyi \
               python/tryx/tryx.pyi \
               python/tryx/media.pyi \
               --ignore-missing-imports
