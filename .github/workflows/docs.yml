name: Documentation

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "python/tryx/**"

  pull_request:
    branches: [master, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "python/tryx/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Validate (runs on PR + push) ────────────────────────────────────
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev --group docs --no-install-project

      - name: Validate .pyi stubs with pyright
        run: |
          uv run pyright python/tryx/client.pyi \
                 python/tryx/events.pyi \
                 python/tryx/types.pyi \
                 python/tryx/wacore.pyi \
                 python/tryx/helpers.pyi \
                 python/tryx/backend.pyi \
                 python/tryx/exceptions.pyi \
                 python/tryx/__init__.pyi \
                 python/tryx/tryx.pyi \
                 python/tryx/media.pyi

      - name: Validate .pyi stubs with mypy
        run: |
          uv run mypy python/tryx/client.pyi \
               python/tryx/events.pyi \
               python/tryx/types.pyi \
               python/tryx/wacore.pyi \
               python/tryx/helpers.pyi \
               python/tryx/backend.pyi \
               python/tryx/exceptions.pyi \
               python/tryx/__init__.pyi \
               python/tryx/tryx.pyi \
               python/tryx/media.pyi \
               --ignore-missing-imports

      - name: Build docs (validation only)
        run: uv run --no-project zensical build -f mkdocs.yml -s

  # ── Job 2: Deploy (runs on push to master or tag) ──────────────────────────
  deploy:
    name: Deploy Documentation
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev --group docs --no-install-project

      - name: Build docs
        run: uv run --no-project zensical build -f mkdocs.yml -c

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
